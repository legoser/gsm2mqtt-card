name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is contained in main (releases are cut from main only)
        run: |
          if git merge-base --is-ancestor "$TAG" origin/main; then
            echo "tag $TAG is contained in origin/main — proceeding with release"
          else
            echo "refusing to release: tag $TAG is not contained in origin/main" >&2
            echo "releases must be cut from main: merge into main first, then re-tag" >&2
            exit 1
          fi

      - name: Validate tag format (vMAJOR.MINOR.PATCH)
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag OK: $TAG"
          else
            echo "tag must match vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Package Release Archive
        run: |
          mkdir -p release_package
          cp dist/gsm2mqtt-card.js release_package/
          cp install.sh README.md hacs.json release_package/
          cd release_package
          zip -r "../gsm2mqtt-card-${TAG}.zip" ./*
          cd ..

      - name: Generate Release Notes
        run: |
          {
            prev="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -x -v "$TAG" | head -n 1 || true)"
            if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
            echo "## What's changed ($range)"
            echo
            git log "$range" --pretty=format:'- %s (%h)' --no-merges 2>/dev/null \
              || git log -20 HEAD --pretty=format:'- %s (%h)' --no-merges
            echo ""
            echo "## 🛠 Installation"
            echo ""
            echo "### Via HACS (Recommended)"
            echo "1. Go to HACS -> Frontend -> 3 dots (top right) -> Custom repositories"
            echo "2. Add this repository URL with category \`Dashboard\`"
            echo "3. Click Download"
            echo ""
            echo "### Manual Installation"
            echo "Download \`gsm2mqtt-card-${TAG}.zip\`, extract it, and run \`./install.sh\` on your Home Assistant machine."
            echo "Or simply copy \`gsm2mqtt-card.js\` to your \`/config/www/gsm2mqtt/\` directory."
          } > release_notes.md

      - name: Publish Forgejo Release with assets
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          auth="Authorization: token ${FORGEJO_TOKEN}"
          # Reuse existing release on re-run, create otherwise.
          id="$(curl -sS -H "$auth" "${API}/releases/tags/${TAG}" | jq -r '.id // empty')"
          if [ -z "$id" ]; then
            id="$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg tag "$TAG" --arg name "$TAG" \
                --rawfile body release_notes.md \
                '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}')" \
              "${API}/releases" | jq -r '.id // empty')"
          fi
          if [ -z "$id" ]; then echo "failed to create or find release $TAG" >&2; exit 1; fi
          echo "release id: $id"
          for f in dist/gsm2mqtt-card.js "gsm2mqtt-card-${TAG}.zip"; do
            echo "uploading $(basename "$f")..."
            curl -sS -X POST -H "$auth" --data-binary "@${f}" \
              "${API}/releases/${id}/assets?name=$(basename "$f")" > /dev/null
          done
          echo "published: ${API}/releases/${id}"
