name: Validate & Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Verify Distribution Files
        run: |
          if [ ! -f dist/gsm2mqtt-card.js ]; then
            echo "Error: dist/gsm2mqtt-card.js not found!" >&2
            exit 1
          fi
          echo "Build successful: $(ls -lh dist/gsm2mqtt-card.js)"

      - name: Validate HACS Manifest & Images
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("hacs.json", "utf8"));
            if (!manifest.name) throw new Error("hacs.json is missing required field: name");
            if (!manifest.filename) throw new Error("hacs.json is missing required field: filename");
            const allowed = ["content_in_root","country","filename","hacs","hide_default_branch","homeassistant","persistent_directory","render_readme","zip_release","name"];
            for (const key of Object.keys(manifest)) {
              if (!allowed.includes(key)) throw new Error(`Invalid key in hacs.json: ${key}`);
            }
            console.log("hacs.json is valid:", manifest);

            const readme = fs.readFileSync("README.md", "utf8");
            for (const img of ["card-overview.png", "card-history.png", "card-tarif.png"]) {
              if (!fs.existsSync(`docs/images/${img}`)) throw new Error(`Missing image: docs/images/${img}`);
              if (!readme.includes(img)) throw new Error(`Image ${img} is not referenced in README.md`);
            }
            console.log("All screenshots verified and referenced in README.md");
          '
