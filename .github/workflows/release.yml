name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is contained in main (releases are cut from main only)
        run: |
          if git merge-base --is-ancestor "$TAG" origin/main; then
            echo "tag $TAG is contained in origin/main — proceeding with release"
          else
            echo "refusing to release: tag $TAG is not contained in origin/main" >&2
            echo "releases must be cut from main: merge into main first, then re-tag" >&2
            exit 1
          fi

      - name: Validate tag format (vMAJOR.MINOR.PATCH)
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag OK: $TAG"
          else
            echo "tag must match vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Package Release Archive
        run: |
          mkdir -p release_package
          cp dist/gsm2mqtt-card.js release_package/
          cp install.sh README.md hacs.json release_package/
          cd release_package
          zip -r "../gsm2mqtt-card-${TAG}.zip" ./*
          cd ..

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Append Install Instructions to Release Notes
        run: |
          {
            cat CHANGELOG.md
            echo ""
            echo "## 🛠 Installation"
            echo ""
            echo "### Via HACS (Recommended)"
            echo "1. Go to HACS -> Frontend -> 3 dots (top right) -> Custom repositories"
            echo "2. Add \`https://github.com/legoser/gsm2mqtt-card\` with category \`Dashboard\`"
            echo "3. Click Download"
            echo ""
            echo "### Manual Installation"
            echo "Download \`gsm2mqtt-card-${TAG}.zip\`, extract it, and run \`./install.sh\` on your Home Assistant machine."
            echo "Or simply copy \`gsm2mqtt-card.js\` to your \`/config/www/gsm2mqtt/\` directory."
          } > release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/gsm2mqtt-card.js
            gsm2mqtt-card-${TAG}.zip
