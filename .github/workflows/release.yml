name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Package Release Archive
        run: |
          mkdir -p release_package
          cp dist/gsm2mqtt-card.js release_package/
          cp install.sh README.md hacs.json release_package/
          cd release_package
          zip -r ../gsm2mqtt-ha-addon-${TAG}.zip ./*
          cd ..

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v3
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Append Install Instructions to Release Notes
        run: |
          {
            cat CHANGELOG.md
            echo ""
            echo "## 🛠 Installation"
            echo ""
            echo "### Via HACS (Recommended)"
            echo "1. Go to HACS -> Frontend -> 3 dots (top right) -> Custom repositories"
            echo "2. Add this repository URL with category \`Lovelace\`"
            echo "3. Click Download"
            echo ""
            echo "### Manual Installation"
            echo "Download \`gsm2mqtt-ha-addon-${TAG}.zip\`, extract it, and run \`./install.sh\` on your Home Assistant machine."
            echo "Or simply copy \`gsm2mqtt-card.js\` to your \`/config/www/gsm2mqtt/\` directory."
          } > release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/gsm2mqtt-card.js
            gsm2mqtt-ha-addon-${TAG}.zip
